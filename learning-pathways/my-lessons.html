<body class="licence-dashboard">
    <div class="page-shell">
        <header class="hero practical-skills-hero">
            <nav class="topbar" aria-label="Primary"><a class="brand" href="/index.html">Computer Lab</a></nav>
        </header>
        <main class="home-grid single-column">
            <section class="student-licence" aria-labelledby="my-lessons-title">
                <div class="licence-card-heading">
                    <img src="../images/whs%20logo%20circular%20reo%20.png" alt="Westland High School logo" width="80" height="80">
                    <div><p class="section-kicker">Westland High School</p><h1 id="my-lessons-title">My Lessons</h1></div>
                </div>
                <h2 id="my-lessons-student-name">Your Pathways lessons</h2>
                <p id="my-lessons-student-email">Sign in with your school account to show your name.</p>
                <p class="my-lessons-intro">Choose an activity to start or continue.</p>
                <p id="my-lessons-status" class="upload-status" role="status" aria-live="polite">Loading lesson activities...</p>
                <button id="my-lessons-retry" class="button button-secondary" type="button" hidden>Retry loading lessons</button>
                <div id="my-lessons-units" hidden></div>
                <noscript><p>Enable JavaScript to load your lesson activities.</p></noscript>
                <p class="licence-card-footnote">Activities are listed in lesson order. <a href="/learning-pathways/">Browse the Pathways library</a> for Units and lesson plans.</p>
            </section>
        </main>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
