<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List | Computer Lab</title>
    <meta name="description" content="View the current task checklist and linked assessments/projects in one place.">
    <meta name="theme-color" content="#4a1b6f">
    <meta name="hub-google-client-id" content="239433605438-ur2omagmkluhhn7i319g0i82l4l5l1j8.apps.googleusercontent.com">
    <meta name="hub-google-allowed-domain" content="westlandhigh.school.nz">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .task-list-page {
            display: grid;
            gap: 18px;
        }

        .task-list-hero-wrap {
            padding: 0 0 8px;
        }

        .task-list-hero {
            display: flex;
            gap: 16px;
            align-items: stretch;
            justify-content: space-between;
            flex-wrap: wrap;
            border-radius: 18px;
            padding: 20px;
            background: linear-gradient(135deg, #5d2a82 0%, #7b43a1 44%, #9e6bc2 100%);
            color: #fff;
            box-shadow: 0 18px 40px rgba(59, 21, 87, 0.16);
        }

        .task-list-hero-copy {
            min-width: min(520px, 100%);
        }

        .task-list-hero-copy h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            line-height: 0.95;
            font-family: "Fraunces", serif;
        }

        .task-list-hero-copy .hero-text {
            max-width: 60ch;
        }

        .task-list-hero-linked-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 760px;
        }

        .task-list-hero-linked-card {
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 10px;
            backdrop-filter: blur(2px);
        }

        .task-list-hero-linked-title {
            margin: 0 0 6px;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.95);
        }

        .task-list-hero-linked-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 5px;
        }

        .task-list-hero-linked-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.95);
        }

        .task-list-hero-linked-item a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 2px;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .task-list-hero-linked-empty {
            margin: 0;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.86);
        }

        .task-list-hero-stats {
            display: grid;
            gap: 12px;
            min-width: 260px;
        }

        .task-list-stat-list {
            margin: 6px 0 0;
            padding-left: 18px;
            display: grid;
            gap: 3px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.95);
        }

        .task-list-stat-list li {
            line-height: 1.25;
        }

        .task-list-grid {
            display: grid;
            gap: 16px;
        }

        .task-list-callout {
            background: #eef6ff;
            border: 1px solid #c8daf0;
            border-radius: 12px;
            padding: 12px;
        }

        .task-list-callout h3 {
            margin: 0 0 8px;
            color: #1d4367;
            font-size: 1rem;
        }

        .task-list-card {
            border: 1px solid #d4deef;
            border-radius: 16px;
            background: #f8fbff;
            padding: 16px;
            box-shadow: 0 10px 24px rgba(25, 52, 77, 0.06);
        }

        .task-list-card h2,
        .task-list-card h3 {
            margin: 0 0 10px;
            color: #213f60;
        }

        .task-list-status {
            margin: 0;
            min-height: 1.1em;
            color: #2f5f8f;
            font-size: 0.86rem;
        }

        .task-list-status.is-error {
            color: #b23a3a;
        }

        .task-list-section-title {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #1d4367;
        }

        .task-list-alloc-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .task-list-alloc-item {
            border: 1px solid #cfdded;
            border-radius: 10px;
            background: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .task-list-alloc-name {
            font-weight: 700;
            color: #1f3550;
        }

        .task-list-link-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .task-list-link-card {
            border: 1px solid #dbe4f2;
            border-radius: 12px;
            background: #fff;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .task-list-link-title {
            margin: 0;
            font-weight: 700;
            color: #1f3550;
        }

        .task-list-link-meta {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: #4a647f;
        }

        .task-list-empty {
            margin: 8px 0 0;
            color: #37546e;
            font-size: 0.92rem;
        }

        .task-list-checklist-grid {
            display: grid;
            gap: 12px;
        }

        .task-list-checklist-card {
            border-radius: 14px;
            background: #f8f8ff;
            border: 1px solid #d5d1f3;
            padding: 14px;
        }

        .task-list-checklist-summary {
            cursor: pointer;
            color: #142d59;
            font-size: 1.08rem;
            font-weight: 800;
            list-style-position: outside;
        }

        .task-list-checklist-summary::marker {
            color: #3576bd;
        }

        .task-list-checklist-card-content {
            margin-top: 10px;
        }

        .task-list-checklist-card-content > h3 {
            display: none;
        }

        .task-list-do-chip {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #d8cff3;
            color: #513478;
            font-weight: 700;
            font-size: 0.82rem;
        }

        .task-list-do-chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .task-list-step-link {
            font-size: 0.92rem;
            color: #17314d;
            line-height: 1.35;
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
        }

        .task-list-step-link:hover,
        .task-list-step-link:focus-visible {
            color: #0f3f73;
            outline: none;
        }

        .task-list-achieved-subheading[id] {
            scroll-margin-top: 16px;
        }

        .task-list-step-list {
            display: grid;
            gap: 8px;
            margin-top: 8px;
        }

        .task-list-level-group {
            margin-top: 10px;
            border-top: 1px dashed #d8d4ef;
            padding-top: 10px;
        }

        .task-list-level-group h4 {
            margin: 0 0 6px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #355271;
        }

        .task-list-achieved-subheading {
            margin: 8px 0 2px;
            padding: 5px 9px;
            border-radius: 8px;
            border: 1px solid #d9e3f5;
            background: #f5f8ff;
            color: #214670;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .task-list-achieved-note {
            margin: 4px 0 2px;
            font-size: 0.78rem;
            color: #345778;
            font-weight: 700;
        }

        .task-list-digital-media-type {
            margin: 3px 0 8px;
            color: #1f5b34;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .task-list-merit-trello-note {
            margin: 2px 0 10px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #f0d9a8;
            background: #fff9ec;
            color: #6b5218;
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .task-list-sync-drive-btn {
            font-size: 0.72rem;
            font-family: inherit;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1.5px solid #5b8fbf;
            background: #eef4fb;
            color: #1a5fa8;
            cursor: pointer;
            white-space: nowrap;
        }
        .task-list-sync-drive-btn:hover:not(:disabled) { background: #d0e6f8; }
        .task-list-sync-drive-btn:disabled { opacity: 0.6; cursor: default; }

        .task-list-sync-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .task-list-system-list {
            margin: 8px 0 2px;
            border: 1px solid #d6ddef;
            background: #f7faff;
            border-radius: 10px;
            padding: 8px 10px;
        }

        .task-list-system-title {
            margin: 0 0 4px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #49688a;
        }

        .task-list-system-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.83rem;
            color: #17314d;
        }

        .task-list-system-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #7aa9e8;
            border-radius: 4px;
            background: #ffffff;
            position: relative;
            margin: 0;
            flex: 0 0 auto;
        }

        .task-list-system-item input[type="checkbox"]:disabled {
            opacity: 1;
        }

        .task-list-system-item input[type="checkbox"]:checked {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .task-list-system-item input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 1px;
            width: 4px;
            height: 9px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .task-list-system-item:has(input[type="checkbox"]:checked) {
            background: #eaf2ff;
            border: 1px solid #95baf0;
            border-radius: 7px;
            padding: 2px 7px;
            color: #133b7a;
        }

        .task-list-decomposition-subtasks {
            margin: 8px 0 2px 18px;
            border: 1px solid #a9c7df;
            border-left: 4px solid #397cad;
            border-radius: 8px;
            background: #eef7fc;
            padding: 8px 10px;
        }

        .task-list-decomposition-subtask-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .task-list-decomposition-category-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 6px;
        }

        .task-list-decomposition-category {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 1px solid #bed6e8;
            border-radius: 6px;
            background: #ffffff;
            color: #1e5986;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 7px 9px;
            text-decoration: none;
        }

        .task-list-decomposition-category:hover {
            text-decoration: underline;
        }

        .task-list-decomposition-category.is-covered {
            border-color: #7fb98f;
            background: #eef8f0;
            color: #1f5a33;
        }

        .task-list-decomposition-category-count {
            min-width: 22px;
            border-radius: 999px;
            background: #17456f;
            color: #ffffff;
            padding: 1px 7px;
            text-align: center;
            font-size: 0.74rem;
        }

        .task-list-decomposition-category.is-covered .task-list-decomposition-category-count {
            background: #2f7a4a;
        }

        .task-list-relevant-implications-subtasks {
            margin: 8px 0 2px 18px;
            border: 1px solid #a9c7df;
            border-left: 4px solid #397cad;
            border-radius: 8px;
            background: #eef7fc;
            padding: 8px 10px;
        }

        .task-list-relevant-implications-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .task-list-relevant-implication-card {
            display: grid;
            grid-template-columns: auto 48px minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            min-height: 58px;
            border: 1px solid #bed6e8;
            border-radius: 7px;
            background: #ffffff;
            padding: 5px 7px;
        }

        .task-list-relevant-implication-card.is-complete {
            border-color: #7fb98f;
            background: #eef8f0;
        }

        .task-list-relevant-implication-card input {
            margin: 0;
        }

        .task-list-relevant-implication-icon {
            width: 48px;
            height: 48px;
            overflow: hidden;
            border-radius: 8px;
            background: #dcecf7;
        }

        .task-list-relevant-implication-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .task-list-relevant-implication-card-copy {
            min-width: 0;
        }

        .task-list-relevant-implication-card-copy .task-list-step-link {
            display: block;
            font-size: 0.76rem;
            line-height: 1.2;
        }

        @media (max-width: 640px) {
            .task-list-relevant-implications-grid {
                grid-template-columns: 1fr;
            }
        }

        .task-list-decomposition-subtask {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid #bed6e8;
            border-radius: 6px;
            background: #ffffff;
            color: #1e5986;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 6px 8px;
        }

        .task-list-decomposition-subtask a {
            display: flex;
            align-items: center;
            gap: 7px;
            color: inherit;
            text-decoration: none;
        }

        .task-list-decomposition-subtask a:hover {
            text-decoration: underline;
        }

        .task-list-decomposition-subtask input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            margin: 0;
            flex: 0 0 auto;
            border: 2px solid #7aa9e8;
            border-radius: 4px;
            background: #ffffff;
            position: relative;
            opacity: 1;
        }

        .task-list-decomposition-subtask input[type="checkbox"]:checked {
            border-color: #1d4ed8;
            background: #1d4ed8;
        }

        .task-list-decomposition-subtask input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 3px;
            height: 7px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .task-list-system-logo {
            display: block;
            width: 36px !important;
            height: 36px !important;
            min-width: 36px;
            min-height: 36px;
            max-width: 36px;
            max-height: 36px;
            flex: 0 0 36px;
        }

        .task-list-system-logo-trello { color: #0c66e4; }
        .task-list-system-logo-github { color: #24292f; }
        .task-list-system-logo-onedrive { color: #0078d4; }
        .task-list-system-logo-drive { color: #4285f4; }

        .task-list-decomposition-subtask.is-complete {
            background: #eaf2ff;
            border-color: #95baf0;
            color: #133b7a;
        }

        .task-list-decomposition-subtask:hover {
            background: #dceefa;
            border-color: #7aafd3;
        }

        .task-list-step-row {
            border: 1px solid #d9e0ef;
            background: #fff;
            border-radius: 10px;
            padding: 8px 10px;
        }

        .task-list-step-row.is-system-complete {
            border-color: #7aa9e8;
            background: #f1f7ff;
            box-shadow: inset 0 0 0 1px #d3e5ff;
        }

        .task-list-step-row.is-relevant-implications-category {
            margin-left: 18px;
            border-style: dashed;
            background: #f9fbff;
        }

        .task-list-step-row.is-informational {
            border-color: #d7c9a6;
            background: #fff8e7;
        }

        .task-list-step-row.is-informational .task-list-step-text {
            color: #6e5730;
        }

        .task-list-step-row.is-linked-relevant-implications {
            border-color: #b9a8dc;
            background: #f1ecff;
        }

        .task-list-step-row.is-linked-relevant-implications .task-list-step-link {
            color: #4f397c;
        }

        .task-list-step-check-wrap {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .task-list-step-check-wrap input[type="checkbox"] {
            margin-top: 3px;
            width: 19px;
            height: 19px;
            accent-color: #1d4ed8;
        }

        .task-list-step-check-wrap input[type="checkbox"]:checked {
            filter: saturate(180%) contrast(130%);
        }

        .task-list-step-text {
            font-size: 0.92rem;
            color: #17314d;
            line-height: 1.35;
        }

        .task-list-step-text-category {
            font-size: 0.9rem;
            color: #234667;
            font-weight: 600;
        }

        @media (max-width: 820px) {
            .task-list-link-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-list-hero-copy {
                min-width: 100%;
            }

            .task-list-hero-linked-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <nav class="topbar" aria-label="Primary"></nav>
                <div class="task-list-hero-wrap">
                    <div class="task-list-hero" id="task-list-hero"></div>
                </div>
        </header>

        <main class="home-grid single-column">
            <div class="hub-column activities-column">
                <section class="task-list-page">
                    <section class="task-list-card">
                        <div class="section-heading">
                            <div>
                                <p class="section-kicker">TASK ACCESS</p>
                                <h2>Current Task List</h2>
                            </div>
                        </div>
                        <div id="task-list-context" class="task-list-callout" hidden></div>
                        <p id="task-list-status" class="task-list-status" aria-live="polite"></p>
                    </section>

                    <section class="task-list-card">
                        <div class="section-heading">
                            <div>
                                <p class="section-kicker">TASK LIST</p>
                                <h2>Checklist</h2>
                            </div>
                            <div class="task-list-sync-actions">
                                <button type="button" class="task-list-sync-drive-btn" id="task-list-sync-trello">&#x21bb; Sync from Trello</button>
                                <button type="button" class="task-list-sync-drive-btn" id="task-list-sync-drive">&#x21bb; Sync from Google Drive</button>
                                <button type="button" class="task-list-sync-drive-btn" id="task-list-sync-github">&#x21bb; Sync from GitHub</button>
                                <button type="button" class="task-list-sync-drive-btn" id="task-list-open-asset-manager">Asset Manager</button>
                            </div>
                        </div>
                        <div id="task-list-checklist" class="task-list-checklist-grid"></div>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>
    <script src="task-list.js"></script>
</body>
</html>
