<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List | Computer Lab</title>
    <meta name="description" content="View the current task checklist and linked assessments/projects in one place.">
    <meta name="theme-color" content="#4a1b6f">
    <meta name="hub-google-client-id" content="239433605438-ur2omagmkluhhn7i319g0i82l4l5l1j8.apps.googleusercontent.com">
    <meta name="hub-google-allowed-domain" content="westlandhigh.school.nz">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .task-list-page {
            display: grid;
            gap: 18px;
        }

        .task-list-hero-wrap {
            padding: 0 0 8px;
        }

        .task-list-hero {
            display: flex;
            gap: 16px;
            align-items: stretch;
            justify-content: space-between;
            flex-wrap: wrap;
            border-radius: 18px;
            padding: 20px;
            background: linear-gradient(135deg, #5d2a82 0%, #7b43a1 44%, #9e6bc2 100%);
            color: #fff;
            box-shadow: 0 18px 40px rgba(59, 21, 87, 0.16);
        }

        .task-list-hero-copy {
            min-width: min(520px, 100%);
        }

        .task-list-hero-copy h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            line-height: 0.95;
            font-family: "Fraunces", serif;
        }

        .task-list-hero-copy .hero-text {
            max-width: 60ch;
        }

        .task-list-hero-stats {
            display: grid;
            gap: 12px;
            min-width: 260px;
        }

        .task-list-grid {
            display: grid;
            gap: 16px;
        }

        .task-list-callout {
            background: #eef6ff;
            border: 1px solid #c8daf0;
            border-radius: 12px;
            padding: 12px;
        }

        .task-list-callout h3 {
            margin: 0 0 8px;
            color: #1d4367;
            font-size: 1rem;
        }

        .task-list-card {
            border: 1px solid #d4deef;
            border-radius: 16px;
            background: #f8fbff;
            padding: 16px;
            box-shadow: 0 10px 24px rgba(25, 52, 77, 0.06);
        }

        .task-list-card h2,
        .task-list-card h3 {
            margin: 0 0 10px;
            color: #213f60;
        }

        .task-list-status {
            margin: 0;
            min-height: 1.1em;
            color: #2f5f8f;
            font-size: 0.86rem;
        }

        .task-list-status.is-error {
            color: #b23a3a;
        }

        .task-list-section-title {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #1d4367;
        }

        .task-list-alloc-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .task-list-alloc-item {
            border: 1px solid #cfdded;
            border-radius: 10px;
            background: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .task-list-alloc-name {
            font-weight: 700;
            color: #1f3550;
        }

        .task-list-link-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .task-list-link-card {
            border: 1px solid #dbe4f2;
            border-radius: 12px;
            background: #fff;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .task-list-link-title {
            margin: 0;
            font-weight: 700;
            color: #1f3550;
        }

        .task-list-link-meta {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: #4a647f;
        }

        .task-list-empty {
            margin: 8px 0 0;
            color: #37546e;
            font-size: 0.92rem;
        }

        .task-list-checklist-grid {
            display: grid;
            gap: 12px;
        }

        .task-list-checklist-card {
            border-radius: 14px;
            background: #f8f8ff;
            border: 1px solid #d5d1f3;
            padding: 14px;
        }

        .task-list-do-chip {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #d8cff3;
            color: #513478;
            font-weight: 700;
            font-size: 0.82rem;
        }

        .task-list-do-chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .task-list-step-link {
            font-size: 0.92rem;
            color: #17314d;
            line-height: 1.35;
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
        }

        .task-list-step-link:hover,
        .task-list-step-link:focus-visible {
            color: #0f3f73;
            outline: none;
        }

        .task-list-step-list {
            display: grid;
            gap: 8px;
            margin-top: 8px;
        }

        .task-list-level-group {
            margin-top: 10px;
            border-top: 1px dashed #d8d4ef;
            padding-top: 10px;
        }

        .task-list-level-group h4 {
            margin: 0 0 6px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #355271;
        }

        .task-list-system-list {
            margin: 8px 0 2px;
            border: 1px solid #d6ddef;
            background: #f7faff;
            border-radius: 10px;
            padding: 8px 10px;
        }

        .task-list-system-title {
            margin: 0 0 4px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #49688a;
        }

        .task-list-system-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.83rem;
            color: #17314d;
        }

        .task-list-system-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
        }

        .task-list-step-row {
            border: 1px solid #d9e0ef;
            background: #fff;
            border-radius: 10px;
            padding: 8px 10px;
        }

        .task-list-step-check-wrap {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .task-list-step-check-wrap input[type="checkbox"] {
            margin-top: 3px;
            width: 16px;
            height: 16px;
        }

        .task-list-step-text {
            font-size: 0.92rem;
            color: #17314d;
            line-height: 1.35;
        }

        @media (max-width: 820px) {
            .task-list-link-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-list-hero-copy {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <nav class="topbar" aria-label="Primary"></nav>
                <div class="task-list-hero-wrap">
                    <div class="task-list-hero" id="task-list-hero"></div>
                </div>
        </header>

        <main class="home-grid single-column">
            <div class="hub-column activities-column">
                <section class="task-list-page">
                    <section class="task-list-card">
                        <div class="section-heading">
                            <div>
                                <p class="section-kicker">TASK ACCESS</p>
                                <h2>Current Task List</h2>
                            </div>
                        </div>
                        <div id="task-list-context" class="task-list-callout" hidden></div>
                        <p id="task-list-status" class="task-list-status" aria-live="polite"></p>
                    </section>

                    <section class="task-list-card">
                        <h3 class="task-list-section-title">My Assessment Tasks</h3>
                        <ul id="task-list-assessments" class="task-list-alloc-list"></ul>
                        <p id="task-list-assessments-empty" class="task-list-empty" hidden>No assessment tasks allocated yet.</p>
                    </section>

                    <section class="task-list-card">
                        <h3 class="task-list-section-title">My Projects</h3>
                        <ul id="task-list-projects" class="task-list-alloc-list"></ul>
                        <p id="task-list-projects-empty" class="task-list-empty" hidden>No projects allocated yet.</p>
                    </section>

                    <section class="task-list-card">
                        <div class="section-heading">
                            <div>
                                <p class="section-kicker">TASK LIST</p>
                                <h2>Checklist</h2>
                            </div>
                        </div>
                        <div id="task-list-checklist" class="task-list-checklist-grid"></div>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>
    <script src="task-list.js"></script>
</body>
</html>
