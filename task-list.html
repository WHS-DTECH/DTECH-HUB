<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List | Computer Lab</title>
    <meta name="description" content="Open your allocated assessment and project task lists in one place.">
    <meta name="theme-color" content="#4a1b6f">
    <meta name="hub-google-client-id" content="239433605438-ur2omagmkluhhn7i319g0i82l4l5l1j8.apps.googleusercontent.com">
    <meta name="hub-google-allowed-domain" content="westlandhigh.school.nz">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .task-list-grid {
            display: grid;
            gap: 16px;
        }

        .task-list-callout {
            background: #eef6ff;
            border: 1px solid #c8daf0;
            border-radius: 12px;
            padding: 12px;
        }

        .task-list-callout h3 {
            margin: 0 0 8px;
            color: #1d4367;
            font-size: 1rem;
        }

        .task-list-empty {
            margin: 0;
            color: #37546e;
            font-size: 0.92rem;
        }

        .task-list-section-title {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #1d4367;
        }

        .task-list-alloc-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .task-list-alloc-item {
            border: 1px solid #cfdded;
            border-radius: 10px;
            background: #f8fbff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .task-list-alloc-name {
            font-weight: 700;
            color: #1f3550;
        }

        .task-list-meta {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: #4a647f;
        }

        .task-list-status {
            margin: 8px 0 0;
            min-height: 1.1em;
            color: #2f5f8f;
            font-size: 0.86rem;
        }

        .task-list-status.is-error {
            color: #b23a3a;
        }

        @media (max-width: 720px) {
            .task-list-alloc-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <nav class="topbar" aria-label="Primary"></nav>
            <div class="hero-panel">
                <div class="hero-copy">
                    <p class="eyebrow">COMPUTER LAB</p>
                    <h1>My Task List</h1>
                    <p class="hero-text">Open your allocated assessment and project task topics from this page.</p>
                </div>
                <aside class="hero-stats" aria-label="Task list summary">
                    <div class="stat-card">
                        <span class="stat-label">Allocated items</span>
                        <strong id="task-list-total">0</strong>
                        <span class="stat-subline">available now</span>
                    </div>
                </aside>
            </div>
        </header>

        <main class="home-grid single-column">
            <div class="hub-column activities-column">
                <section class="panel-section task-list-grid">
                    <div class="section-heading">
                        <div>
                            <p class="section-kicker">TASK ACCESS</p>
                            <h2>Open Task Lists</h2>
                        </div>
                    </div>

                    <div id="task-list-context" class="task-list-callout" hidden></div>

                    <div>
                        <h3 class="task-list-section-title">My Assessment Tasks</h3>
                        <ul id="task-list-assessments" class="task-list-alloc-list"></ul>
                        <p id="task-list-assessments-empty" class="task-list-empty" hidden>No assessment tasks allocated yet.</p>
                    </div>

                    <div>
                        <h3 class="task-list-section-title">My Projects</h3>
                        <ul id="task-list-projects" class="task-list-alloc-list"></ul>
                        <p id="task-list-projects-empty" class="task-list-empty" hidden>No projects allocated yet.</p>
                    </div>

                    <p id="task-list-status" class="task-list-status" aria-live="polite"></p>
                </section>
            </div>
        </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>
    <script src="task-list.js"></script>
</body>
</html>
