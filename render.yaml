services:
  - type: web
    name: dtech-hub
    runtime: node
    repo: https://github.com/WHS-DTECH/DTECH-HUB
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_ALLOWED_DOMAINS
        sync: false
      - key: HUB_GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_MODE
        sync: false
      - key: GOOGLE_ID_TOKEN_AUDIENCES
        sync: false
      - key: TRELLO_API_KEY
        sync: false
      - key: STAFF_DIRECTORY_API_URL
        sync: false
      - key: STAFF_DIRECTORY_API_KEY
        sync: false
