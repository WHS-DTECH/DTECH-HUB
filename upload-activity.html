<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Activity | Computer Lab</title>
    <meta name="description" content="Upload a new activity card for the DTECH-HUB library.">
    <meta name="theme-color" content="#4a1b6f">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <nav class="topbar" aria-label="Primary">
                <a class="brand" href="index.html">Computer Lab</a>
                <div class="topbar-right">
                    <div class="utility-actions" aria-label="Utility actions">
                        <a href="index.html">Back to Hub</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="upload-page">
            <h1>Upload Activity</h1>
            <p class="intro-text">Create a new activity with an outcome image, resources, equipment, and instructions.</p>

            <section class="upload-panel" aria-label="Upload activity form">
                <h2>New Activity Details</h2>

                <form id="upload-activity-form" class="upload-form">
                    <div class="form-grid">
                        <div class="field">
                            <label for="activity-name">Activity Name</label>
                            <input id="activity-name" name="activityName" type="text" required>
                        </div>

                        <div class="field">
                            <label for="year-level">Year Level</label>
                            <select id="year-level" name="yearLevel" required>
                                <option value="">Select year</option>
                                <option>Year 9</option>
                                <option>Year 10</option>
                                <option>Year 11</option>
                                <option>Year 12</option>
                                <option>Year 13</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="type">Type</label>
                            <input id="type" name="type" type="text" placeholder="Machine Sewing, Embroidery..." required>
                        </div>

                        <div class="field">
                            <label for="activity-category">Activity Category</label>
                            <select id="activity-category" name="activityCategory" required>
                                <option>Practice</option>
                                <option>Skill Activity</option>
                                <option>Project Activity</option>
                                <option>Assessment Activity</option>
                                <option>Practice Activity</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="duration-hours">Duration Hours</label>
                            <input id="duration-hours" name="durationHours" type="number" min="1" step="1" required>
                        </div>

                        <div class="field">
                            <label for="difficulty">Difficulty</label>
                            <select id="difficulty" name="difficulty" required>
                                <option value="">Select difficulty</option>
                                <option>Beginner</option>
                                <option>Intermediate</option>
                                <option>Advanced</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="card-color">Card Color</label>
                            <select id="card-color" name="cardColor" required>
                                <option>Rose</option>
                                <option>Azure</option>
                                <option>Amber</option>
                                <option>Violet</option>
                                <option>Teal</option>
                                <option>Slate</option>
                            </select>
                        </div>

                        <div class="field field-wide">
                            <label for="outcome-image-url">Outcome Image URL</label>
                            <input id="outcome-image-url" name="outcomeImageUrl" type="url" placeholder="https://... or /images/uploads/your-file.jpg">
                        </div>

                        <div class="field field-wide">
                            <label for="outcome-image-file">Upload Outcome Image (PNG or JPG)</label>
                            <input id="outcome-image-file" name="outcomeImageFile" type="file" accept="image/png,image/jpeg,image/jpg">
                            <p class="help-text">Upload an image and the URL above will be filled automatically from Cloudinary.</p>
                        </div>

                        <div class="field field-wide">
                            <label for="short-description">Short Description</label>
                            <textarea id="short-description" name="shortDescription"></textarea>
                        </div>

                        <div class="field field-wide">
                            <label for="resources">Resources (one per line)</label>
                            <textarea id="resources" name="resources" placeholder="Fabric&#10;Pattern piece&#10;Thread"></textarea>
                        </div>

                        <div class="field field-wide">
                            <label for="equipment">Equipment (one per line)</label>
                            <textarea id="equipment" name="equipment" placeholder="Sewing machine&#10;Pins&#10;Scissors"></textarea>
                        </div>

                        <div class="field field-wide">
                            <label for="instructions">Instructions (one step per line)</label>
                            <textarea id="instructions" name="instructions" placeholder="Cut fabric pieces...&#10;Pin edges together...&#10;Sew with 1cm seam allowance..."></textarea>
                        </div>

                        <div class="field field-wide">
                            <label for="class-management">Teacher Card: Class Management Notes</label>
                            <textarea id="class-management" name="classManagementNotes" placeholder="Grouping strategy, behaviour cues, pacing checkpoints..."></textarea>
                        </div>

                        <div class="field field-wide">
                            <label for="class-preparation">Teacher Card: Class Preparation</label>
                            <textarea id="class-preparation" name="classPreparation" placeholder="Prep materials, machine setup, starter task..."></textarea>
                        </div>

                        <div class="field field-wide">
                            <label for="assessment-focus">Teacher Card: Assessment Focus</label>
                            <textarea id="assessment-focus" name="assessmentFocus" placeholder="What evidence to observe or collect..."></textarea>
                        </div>
                    </div>

                    <label class="checkbox-field" for="show-this-week">
                        <input id="show-this-week" name="showThisWeek" type="checkbox">
                        Show in This Week section
                    </label>

                    <div class="form-actions">
                        <button class="button-save" type="submit">Save Activity</button>
                        <button class="button-cancel" type="button" id="cancel-upload">Cancel</button>
                    </div>

                    <p id="upload-status" class="upload-status" aria-live="polite"></p>
                    <pre id="export-preview" class="export-preview" hidden></pre>
                </form>
            </section>
        </main>
    </div>

    <script src="upload-activity.js"></script>
</body>
</html>
