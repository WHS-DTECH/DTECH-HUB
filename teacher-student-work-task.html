<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Item Student Work | Computer Lab</title>
  <meta name="hub-google-client-id" content="239433605438-ur2omagmkluhhn7i319g0i82l4l5l1j8.apps.googleusercontent.com">
  <meta name="hub-google-allowed-domain" content="westlandhigh.school.nz">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .work-page {
      width: min(1500px, calc(100% - 28px));
      margin: 20px auto 40px;
    }

    .work-header h1 {
      margin: 0 0 6px;
      font-family: "Fraunces", serif;
      color: #173f63;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    }

    .work-header p {
      margin: 0 0 12px;
      color: #4a6077;
      font-size: 0.9rem;
    }

    .work-status {
      min-height: 1.2em;
      margin: 6px 0 0;
      font-size: 0.8rem;
      color: #355879;
    }

    .work-status.is-error {
      color: #b23939;
    }

    .tracker-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tracker-summary span {
      border: 1px solid #c3d4e8;
      background: #edf4fc;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.75rem;
      color: #21496f;
      font-weight: 700;
    }

    .work-table-wrap {
      overflow-x: auto;
      border: 1px solid #ccd8e8;
      border-radius: 10px;
      background: #f6f9fd;
      padding: 10px;
    }

    .work-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      min-width: 980px;
    }

    .work-table th {
      text-align: left;
      padding: 7px 10px;
      background: #e6eef8;
      color: #153e64;
      border-bottom: 2px solid #c5d6ea;
    }

    .work-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #dbe5f1;
      vertical-align: middle;
    }

    .work-table tr:last-child td {
      border-bottom: none;
    }

    .slides-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid;
    }

    .slides-pill.is-linked {
      background: #dff4e7;
      color: #1f663d;
      border-color: #add7bc;
    }

    .slides-pill.is-missing {
      background: #fff2f2;
      color: #8b2f2f;
      border-color: #e4bbbb;
    }

    .submitted-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid;
      background: #edf3fc;
      color: #2a4f76;
      border-color: #c3d2e7;
    }

    .work-empty {
      border: 1px dashed #c5d3e6;
      border-radius: 10px;
      background: #f8fbff;
      padding: 24px;
      text-align: center;
      color: #607792;
    }

    .work-link-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .work-link-list a {
      font-size: 0.74rem;
      text-decoration: none;
      color: #2f74b9;
      border: 1px solid #c7d7ea;
      border-radius: 999px;
      background: #edf4fc;
      padding: 2px 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <nav class="topbar" aria-label="Primary">
        <a class="brand" href="index.html">Computer Lab</a>
        <div class="topbar-right">
          <div class="topbar-links">
            <a href="teacher-view.html">Teacher View</a>
            <a href="teacher-assessment-allocation.html">Assessment Allocations</a>
            <a href="teacher-project-allocation.html">Project Allocations</a>
            <a href="teacher-student-work.html">Task Item Pages</a>
          </div>
          <div class="utility-actions" aria-label="Utility actions">
            <a id="hub-staff-link" href="teacher-view.html" hidden>Teacher View</a>
            <a id="hub-admin-link" href="admin-menu.html" hidden>Admin Menu</a>
            <span id="hub-access-badge" class="hub-access-badge" hidden aria-live="polite"></span>
            <button id="hub-google-signin" class="google-signin-button" type="button">Sign in with Google</button>
            <button id="hub-google-signout" type="button" hidden>Sign out</button>
            <button id="hub-user-badge" class="user-badge" type="button" hidden aria-label="Open profile" aria-haspopup="true" aria-expanded="false"></button>
          </div>
        </div>
      </nav>
    </header>

    <main class="work-page">
      <section class="panel-section work-header">
        <h1 id="tracker-title">Task Item Student Evidence</h1>
        <p>This page is dedicated to one task item. Use the table to check who has linked Google Slides and submitted.</p>
        <p><a href="teacher-student-work.html">Back to Task Item Pages</a></p>
        <p id="work-status" class="work-status" aria-live="polite"></p>
      </section>

      <section class="panel-section">
        <div id="tracker-summary" class="tracker-summary"></div>
        <div id="work-table-host"></div>
      </section>
    </main>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="script.js"></script>
  <script src="teacher-student-work.js"></script>
</body>
</html>
